<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD BG Remover - Sharp Clean Cut</title>
<meta name="description" content="Free HD BG Remover - Sharp Clean Cut No Blur - Mobile Laptop Friendly">
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:12px;margin:0}
.box{max-width:650px;width:100%;margin:auto;background:#1e293b;padding:20px;border-radius:20px}
h1{font-size:24px}
p{font-size:15px;color:#cbd5e1;line-height:1.5}
.upload{border:2px dashed #38bdf8;padding:20px;border-radius:15px;cursor:pointer;background:#0f172a}
.upload img, .upload canvas{max-width:100%;height:auto;border-radius:12px;margin-top:12px;display:none;image-rendering:auto}
button{background:#4f46e5;color:white;border:none;padding:15px;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin:8px 0;width:100%}
#downloadBtn{background:#16a34a !important}
a{color:white;text-decoration:none}
footer{margin-top:18px;font-size:14px;line-height:1.8}
footer a{margin:0 6px}
#status{margin:12px 0;color:#facc15;font-size:14px}
select{width:100%;padding:14px;border-radius:12px;margin:8px 0;font-size:16px}
@media(max-width:500px){.box{padding:14px} h1{font-size:22px}}
</style>
</head>
<body>
<div class="box">
<h1>✨ HD BG Remover - SHARP</h1>
<p>Clean Sharp Cut - No Blur - No Soft Edges<br>Mobile & Laptop Friendly</p>
<div class="upload" onclick="document.getElementById('file').click()">
<p style="font-size:28px;margin:5px">📸</p>
<p><b>Click Here to Upload Photo</b></p>
<input type="file" id="file" accept="image/*" hidden>
<img id="preview">
<canvas id="resultCanvas"></canvas>
<p id="status"></p>
</div>
<label>Choose Background:</label>
<select id="bgSelect" onchange="drawSharp()">
<option value="transparent">Transparent (No Background)</option>
<option value="white">White Background - Passport</option>
<option value="blue">Blue Background - ID Card</option>
<option value="red">Red Background</option>
<option value="green">Green Background</option>
</select>
<button id="removeBtn" onclick="removeBg()">Remove Background - Sharp Cut</button>
<button id="downloadBtn" onclick="downloadImg()" style="display:none">⬇ Download HD Sharp Photo</button>
<p style="font-size:12px">Tip: HD photo dalo, blur wali photo ka cut bhi blur hoga.</p>
</div>
<footer>
<a href="index.html">Home</a> | <a href="about.html">About Us</a> | <a href="contact.html">Contact Us</a> | <a href="privacy.html">Privacy Policy</a>
<p>© 2026 HD BG Remover - Sharp Cut</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<script>
let selectedFile=null; let originalImage=null; let sharpMask=null; let selfie=null;

document.getElementById('file').addEventListener('change', e=>{
  selectedFile=e.target.files[0];
  if(!selectedFile) return;
  let p=document.getElementById('preview');
  p.src=URL.createObjectURL(selectedFile); p.style.display='block';
  document.getElementById('resultCanvas').style.display='none';
  document.getElementById('downloadBtn').style.display='none';
  document.getElementById('status').innerText='';
  let img=new Image();
  img.onload=()=>{originalImage=img;};
  img.src=URL.createObjectURL(selectedFile);
});

function getSelfie(){
  if(selfie) return selfie;
  selfie=new SelfieSegmentation({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});
  selfie.setOptions({modelSelection:1});
  selfie.onResults(onResults);
  return selfie;
}

function onResults(results){
  // 1. Mask ko Sharp karo - Blur khatam
  let w=originalImage.width, h=originalImage.height;
  let tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  let tctx=tmp.getContext('2d');
  tctx.drawImage(results.segmentationMask,0,0,w,h);
  let imgData=tctx.getImageData(0,0,w,h);
  let d=imgData.data;
  // SHARP THRESHOLD: 100 se upar = poora insaan, neeche = poora khatam, beech ka blur khatam
  for(let i=0;i<d.length;i+=4){
    let v=d[i]; // mask white = insaan
    if(v>100){ d[i+3]=255; } else { d[i+3]=0; }
    d[i]=255; d[i+1]=255; d[i+2]=255;
  }
  tctx.putImageData(imgData,0,0);
  sharpMask=tmp;
  drawSharp();
  document.getElementById('status').innerText='Done! Sharp Clean Cut - No Blur ✅';
  document.getElementById('removeBtn').innerText='Remove Background - Sharp Cut';
}

function drawSharp(){
  if(!sharpMask || !originalImage) return;
  let canvas=document.getElementById('resultCanvas');
  let ctx=canvas.getContext('2d');
  canvas.width=originalImage.width; canvas.height=originalImage.height;
  // Background
  let bg=document.getElementById('bgSelect').value;
  if(bg==='white'){ctx.fillStyle='white'; ctx.fillRect(0,0,canvas.width,canvas.height);}
  else if(bg==='blue'){ctx.fillStyle='#2563eb'; ctx.fillRect(0,0,canvas.width,canvas.height);}
  else if(bg==='red'){ctx.fillStyle='#dc2626'; ctx.fillRect(0,0,canvas.width,canvas.height);}
  else if(bg==='green'){ctx.fillStyle='#16a34a'; ctx.fillRect(0,0,canvas.width,canvas.height);}
  else {ctx.clearRect(0,0,canvas.width,canvas.height);}
  // Sharp Mask lagao - koi blur nahi
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(sharpMask,0,0);
  ctx.globalCompositeOperation='source-in';
  // Original HD photo - bilkul saaf
  ctx.drawImage(originalImage,0,0,canvas.width,canvas.height);
  ctx.globalCompositeOperation='source-over';
  canvas.style.display='block';
  document.getElementById('downloadBtn').style.display='block';
  canvas.scrollIntoView({behavior:'smooth'});
}

async function removeBg(){
  if(!selectedFile){alert('Please select a photo first!');return;}
  document.getElementById('status').innerText='Processing Sharp Cut... 5 sec wait...';
  document.getElementById('removeBtn').innerText='Processing...';
  try{ await getSelfie().send({image: originalImage}); }
  catch(e){ document.getElementById('status').innerText='Dobara Try dabao.'; document.getElementById('removeBtn').innerText='Remove Background - Sharp Cut'; }
}

function downloadImg(){
  let canvas=document.getElementById('resultCanvas');
  let a=document.createElement('a');
  a.href=canvas.toDataURL('image/png',1);
  a.download='sharp-bg-remover.png'; a.click();
}
</script>
</body>
</html>
