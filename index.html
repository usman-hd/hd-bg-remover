<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD BG Remover - Free</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#0f172a;color:#fff;text-align:center;padding:20px}h1{font-size:28px}h1 span{color:#38bdf8}.box{background:#1e293b;border:2px dashed #38bdf8;border-radius:16px;padding:20px;max-width:600px;margin:20px auto;cursor:pointer}img,canvas{max-width:100%;border-radius:12px;margin-top:10px}button{background:#0284c7;color:#fff;border:none;padding:14px 20px;border-radius:10px;font-size:16px;font-weight:bold;width:100%;max-width:600px;cursor:pointer;margin-top:10px}button:disabled{opacity:.5}#status{color:#facc15;margin-top:10px}
</style>
</head>
<body>
<h1>HD BG <span>Remover</span></h1>
<p>Free • No Watermark • HD Download</p>
<div class="box" onclick="document.getElementById('file').click()">
<p>📸 Drop Photo Here - Click Karo</p>
<input type="file" id="file" accept="image/*" hidden>
<img id="preview" style="display:none">
<canvas id="out" style="display:none"></canvas>
</div>
<p id="status">Photo select karo</p>
<button id="btn" disabled>Remove Background</button>
<button id="dl" style="display:none;background:#16a34a">Download HD Photo</button>
<script>
let imgEl=document.getElementById('preview'),fileInput=document.getElementById('file'),btn=document.getElementById('btn'),statusEl=document.getElementById('status');
fileInput.onchange=e=>{
let f=e.target.files[0];if(!f)return;
let r=new FileReader();r.onload=ev=>{imgEl.src=ev.target.result;imgEl.style.display='block';btn.disabled=false;statusEl.textContent='Photo aa gayi! Ab Remove Background dabao';};r.readAsDataURL(f);
};
const seg=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});
seg.setOptions({modelSelection:1});
seg.onResults(res=>{
let c=document.getElementById('out');let ctx=c.getContext('2d');
c.width=res.image.width;c.height=res.image.height;
ctx.drawImage(res.segmentationMask,0,0,c.width,c.height);
ctx.globalCompositeOperation='source-in';ctx.drawImage(res.image,0,0,c.width,c.height);
c.style.display='block';imgEl.style.display='none';
statusEl.textContent='Ho gaya! Background hat gaya ✅';
document.getElementById('dl').style.display='block';
});
btn.onclick=async()=>{statusEl.textContent='AI kaam kar raha hai... 2 second ruko...';btn.disabled=true;await seg.send({image:imgEl});btn.disabled=false;};
document.getElementById('dl').onclick=()=>{
let a=document.createElement('a');a.download='hd-no-bg.png';a.href=document.getElementById('out').toDataURL('image/png');a.click();
};
</script>
</body>
</html>
